name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  fast:
    name: Types, syntax, formatting, and focused tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/checkout@v4
        with:
          repository: TannerMidd/pi-pocket
          ref: v0.22.0
          path: pocket
      - run: npm ci --ignore-scripts
      - run: ln -s pocket/types/pocket.d.ts _pocket.d.ts
      - run: npm run check
      - run: npm run format:check
      - run: npm test
  integration:
    name: Isolated Pi Pocket ${{ matrix.pocket }} integration
    needs: fast
    strategy:
      matrix:
        pocket: [v0.22.0, v0.27.0]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/checkout@v4
        with:
          repository: TannerMidd/pi-pocket
          ref: ${{ matrix.pocket }}
          path: pocket
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: pocket
      - run: npm run test:integration
        env:
          POCKET_SOURCE: ./pocket
